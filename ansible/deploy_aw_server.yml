        - name: Установить helper from-windows для Hayabusa
          ansible.builtin.copy:
            content: |
              #!/usr/bin/env bash
              set -euo pipefail
              exec /usr/local/bin/aw-hayabusa-from-windows-rust "$@"
            dest: /usr/local/bin/aw-hayabusa-from-windows
            owner: root
            group: root
            mode: "0755"

        - name: Положить README Hayabusa в server-side ops bundle
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/hayabusa/README.md"
            dest: /opt/activitywatch/aw-rus-ops/hayabusa/README.md
            owner: root
            group: root
            mode: "0644"

        - name: Проверить локальный Rust helper autoprocess для Hayabusa
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/aw-hayabusa-autoprocess-rust"
          delegate_to: localhost
          register: aw_hayabusa_autoprocess_rust_binary
          become: false

        - name: Установить Rust helper autoprocess для Hayabusa
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/aw-hayabusa-autoprocess-rust"
            dest: /usr/local/bin/aw-hayabusa-autoprocess-rust
            owner: root
            group: root
            mode: "0755"
          when: aw_hayabusa_autoprocess_rust_binary.stat.exists | default(false)

        - name: Требовать Rust helper autoprocess для Hayabusa
          ansible.builtin.assert:
            that:
              - aw_hayabusa_autoprocess_rust_binary.stat.exists | default(false)
            fail_msg: "Missing Rust artifact: {{ aw_rust_release_dir }}/aw-hayabusa-autoprocess-rust"

        - name: Установить helper autoprocess для Hayabusa
          ansible.builtin.copy:
            content: |
              #!/usr/bin/env bash
              set -euo pipefail
              exec /usr/local/bin/aw-hayabusa-autoprocess-rust "$@"
            dest: /usr/local/bin/aw-hayabusa-autoprocess
            owner: root
            group: root
            mode: "0755"

        - name: Проверить локальный Rust helper case-alert для Hayabusa
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/aw-hayabusa-case-alert-rust"
          delegate_to: localhost
          register: aw_hayabusa_case_alert_rust_binary
          become: false

        - name: Установить Rust helper case-alert для Hayabusa
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/aw-hayabusa-case-alert-rust"
            dest: /usr/local/bin/aw-hayabusa-case-alert-rust
            owner: root
            group: root
            mode: "0755"
          when: aw_hayabusa_case_alert_rust_binary.stat.exists | default(false)

        - name: Требовать Rust helper case-alert для Hayabusa
          ansible.builtin.assert:
            that:
              - aw_hayabusa_case_alert_rust_binary.stat.exists | default(false)
            fail_msg: "Missing Rust artifact: {{ aw_rust_release_dir }}/aw-hayabusa-case-alert-rust"

        - name: Установить helper case-alert для Hayabusa
          ansible.builtin.copy:
            content: |
              #!/usr/bin/env bash
              set -euo pipefail
              exec /usr/local/bin/aw-hayabusa-case-alert-rust "$@"
            dest: /usr/local/bin/aw-hayabusa-case-alert
            owner: root
            group: root
            mode: "0755"

        - name: Установить systemd unit aw-hayabusa-drop.service
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/aw-hayabusa-drop.service"
            dest: /etc/systemd/system/aw-hayabusa-drop.service
            owner: root
            group: root
            mode: "0644"
