            path: "{{ aw_rust_release_dir }}/worktime-influx-exporter"
          delegate_to: localhost
          register: aw_worktime_influx_exporter_rust_binary
          become: false
          when: aw_worktime_influx_enabled | default(false) | bool

        - name: Требовать Rust AW worktime Influx exporter artifact
          ansible.builtin.assert:
            that:
              - aw_worktime_influx_exporter_rust_binary.stat.exists | default(false)
            fail_msg: "Missing Rust artifact: {{ aw_rust_release_dir }}/worktime-influx-exporter"
          when: aw_worktime_influx_enabled | default(false) | bool

        - name: Установить Rust AW worktime Influx exporter
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/worktime-influx-exporter"
            dest: /usr/local/bin/aw-worktime-influx-exporter-rust
            owner: root
            group: root
            mode: "0755"
          when:
            - aw_worktime_influx_enabled | default(false) | bool
            - aw_worktime_influx_exporter_rust_binary.stat.exists | default(false)

        - name: Установить systemd timer AW worktime Influx exporter
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/aw-worktime-influx-exporter.timer"
            dest: /etc/systemd/system/aw-worktime-influx-exporter.timer
            owner: root
            group: root
            mode: "0644"
          when: aw_worktime_influx_enabled | default(false) | bool

        - name: Установить systemd unit AW DLP Influx exporter
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/aw-dlp-influx-exporter.service"
            dest: /etc/systemd/system/aw-dlp-influx-exporter.service
            owner: root
            group: root
            mode: "0644"
          when: aw_dlp_influx_enabled | default(false) | bool

        - name: Проверить локальный Rust AW DLP Influx exporter
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/dlp-influx-exporter"
          delegate_to: localhost
          register: aw_dlp_influx_exporter_rust_binary
          become: false
          when: aw_dlp_influx_enabled | default(false) | bool

        - name: Требовать Rust AW DLP Influx exporter artifact
          ansible.builtin.assert:
            that:
              - aw_dlp_influx_exporter_rust_binary.stat.exists | default(false)
            fail_msg: "Missing Rust artifact: {{ aw_rust_release_dir }}/dlp-influx-exporter"
          when: aw_dlp_influx_enabled | default(false) | bool

        - name: Установить Rust AW DLP Influx exporter
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/dlp-influx-exporter"
            dest: /usr/local/bin/aw-dlp-influx-exporter-rust
            owner: root
            group: root
            mode: "0755"
          when:
            - aw_dlp_influx_enabled | default(false) | bool
            - aw_dlp_influx_exporter_rust_binary.stat.exists | default(false)

        - name: Установить systemd timer AW DLP Influx exporter
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/aw-dlp-influx-exporter.timer"
            dest: /etc/systemd/system/aw-dlp-influx-exporter.timer
            owner: root
            group: root
            mode: "0644"
          when: aw_dlp_influx_enabled | default(false) | bool

        - name: Проверить локальный Rust DetMir readiness checker
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/detmir-readiness"
          delegate_to: localhost
          register: detmir_readiness_rust_binary
          become: false

        - name: Требовать Rust DetMir readiness checker artifact
          ansible.builtin.assert:
            that:
              - detmir_readiness_rust_binary.stat.exists | default(false)
            fail_msg: "Missing Rust artifact: {{ aw_rust_release_dir }}/detmir-readiness"

        - name: Установить Rust DetMir readiness checker
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/detmir-readiness"
            dest: /usr/local/bin/detmir-readiness
            owner: root
            group: root
            mode: "0755"
          when: detmir_readiness_rust_binary.stat.exists | default(false)

        - name: Создать private каталог DetMir readiness signing
          ansible.builtin.file:
            path: /etc/detmir-readiness
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Проверить private key DetMir readiness signing
          ansible.builtin.stat:
            path: /etc/detmir-readiness/signing-key.pem
          register: detmir_readiness_signing_key

        - name: Сгенерировать private key DetMir readiness signing
          ansible.builtin.command:
            argv:
              - openssl
              - genpkey
              - -algorithm
              - RSA
              - -pkeyopt
              - rsa_keygen_bits:3072
              - -out
              - /etc/detmir-readiness/signing-key.pem
          when: not (detmir_readiness_signing_key.stat.exists | default(false))
          no_log: true

        - name: Зафиксировать права private key DetMir readiness signing
          ansible.builtin.file:
            path: /etc/detmir-readiness/signing-key.pem
            owner: root
            group: root
            mode: "0600"

        - name: Создать private env DetMir readiness
          ansible.builtin.copy:
            dest: /etc/detmir-readiness.env
            content: ""
            owner: root
            group: root
            mode: "0600"
            force: false

        - name: Настроить private env DetMir readiness signing
          ansible.builtin.blockinfile:
            path: /etc/detmir-readiness.env
            marker: "# {mark} ANSIBLE MANAGED DETMIR READINESS"
            block: |
              DETMIR_READINESS_SIGNING_KEY=/etc/detmir-readiness/signing-key.pem
              DETMIR_READINESS_REQUIRE_SIGNATURE=true
              DETMIR_READINESS_RETENTION_DAYS={{ detmir_readiness_retention_days | default(30) }}
            owner: root
            group: root
            mode: "0600"

        - name: Установить systemd service DetMir readiness bundle
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/detmir-readiness.service"
            dest: /etc/systemd/system/detmir-readiness.service
            owner: root
            group: root
            mode: "0644"

        - name: Установить systemd timer DetMir readiness bundle
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/detmir-readiness.timer"
            dest: /etc/systemd/system/detmir-readiness.timer
            owner: root
            group: root
            mode: "0644"

        - name: Создать каталог Prometheus rules для DetMir readiness
          ansible.builtin.file:
            path: /etc/prometheus/rules
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Установить Prometheus alerts DetMir readiness
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/detmir-readiness-alerts.yml"
            dest: /etc/prometheus/rules/detmir-readiness-alerts.yml
            owner: root
            group: root
            mode: "0644"

        - name: Перезагрузить systemd после установки AW worktime API
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Включить таймер AW-RUS healthd
          ansible.builtin.systemd:
            name: aw-rus-healthd.timer
            enabled: true
            state: started

        - name: Включить таймер AW-RUS SLO monitor
          ansible.builtin.systemd:
            name: aw-slo-monitor.timer
            enabled: true
            state: started

        - name: Включить daily DetMir readiness bundle timer
          ansible.builtin.systemd:
            name: detmir-readiness.timer
            enabled: true
            state: started

        - name: Включить таймер AW-RUS browser smoke
          ansible.builtin.systemd:
            name: aw-browser-smoke.timer
            enabled: true
            state: started
          when: aw_browser_smoke_enabled | default(true) | bool

        - name: Включить и перезапустить DLP policy engine
          ansible.builtin.systemd:
            name: aw-dlp-policy-engine.service
            enabled: true
            state: restarted
          when: aw_dlp_policy_engine_enabled | default(false) | bool

        - name: Включить и перезапустить timer CEF exporter
          ansible.builtin.systemd:
            name: aw-dlp-cef-exporter.timer
            enabled: true
            state: restarted
          when: aw_dlp_integrations_enabled | default(true) | bool

        - name: Включить и перезапустить timer syslog forwarder
          ansible.builtin.systemd:
            name: aw-dlp-syslog-forwarder.timer
            enabled: true
            state: restarted
          when: aw_dlp_integrations_enabled | default(true) | bool

        - name: Включить и перезапустить timer webhook sender
          ansible.builtin.systemd:
            name: aw-dlp-webhook-sender.timer
