            dest: /usr/local/bin/aw-hayabusa-link-case
            owner: root
            group: root
            mode: "0755"

        - name: Проверить локальный Rust helper from-windows для Hayabusa
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/aw-hayabusa-from-windows-rust"
          delegate_to: localhost
          register: aw_hayabusa_from_windows_rust_binary
          become: false

        - name: Установить Rust helper from-windows для Hayabusa
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/aw-hayabusa-from-windows-rust"
