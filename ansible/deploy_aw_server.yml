          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/aw-hayabusa-drop.path"
            dest: /etc/systemd/system/aw-hayabusa-drop.path
            owner: root
            group: root
            mode: "0644"
          notify: Перезагрузить systemd

        - name: Включить и запустить aw-hayabusa-drop.path
          ansible.builtin.systemd:
            name: aw-hayabusa-drop.path
            enabled: true
            state: started
            daemon_reload: true

        - name: Проверить server-side runner через doctor
          ansible.builtin.command:
            cmd: /usr/local/bin/aw-hayabusa doctor
          changed_when: false

        - name: Проверить загрузку profiles Hayabusa
          ansible.builtin.shell: /usr/local/bin/aw-hayabusa profiles > /tmp/aw-hayabusa-profiles.txt
          args:
            executable: /bin/bash
          changed_when: false

        - name: Проверить наличие standard profile у Hayabusa
          ansible.builtin.shell: "grep -q 'standard:' /tmp/aw-hayabusa-profiles.txt"
          args:
            executable: /bin/bash
          changed_when: false

    - name: Post-deploy health gate (aw-rus-healthd)
      when:
        - not ansible_check_mode
        - aw_server_post_deploy_health_check_enabled | default(true) | bool
      block:
        - name: Запустить /usr/local/bin/aw-rus-healthd-rust --json
          ansible.builtin.command:
            cmd: /usr/local/bin/aw-rus-healthd-rust --json
          register: aw_post_deploy_health
          changed_when: false
          failed_when: false

        - name: Показать результат aw-rus-healthd
          ansible.builtin.debug:
            msg: "{{ aw_post_deploy_health.stdout }}"

  handlers:
    - name: Перезагрузить systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Перезапустить activitywatch
      ansible.builtin.systemd:
        name: activitywatch-server.service
        state: restarted
