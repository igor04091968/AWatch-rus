---
- name: Развернуть сервер AWatch-rus
  hosts: aw_server
  become: true
  gather_facts: true

  vars:
    aw_release_root: "/opt/activitywatch/releases"
    aw_release_dir: "{{ aw_release_root }}/{{ aw_server_version }}"
    aw_archive_path: "/tmp/activitywatch-{{ aw_server_version }}.zip"
    aw_bootstrap_dir: "/tmp/aw-rus-bootstrap"
    aw_release_install_dir: "{{ aw_release_root }}/aw-server-rust-{{ aw_server_version }}"
    aw_ru_patch_cache_bust: "{{ lookup('file', aw_repo_root + '/aw-server/aw-ru-patch.js') | hash('sha1') | truncate(12, true, '') }}"
    aw_sw_cleanup_cache_bust: "{{ lookup('file', aw_repo_root + '/aw-server/aw-sw-cleanup.js') | hash('sha1') | truncate(12, true, '') }}"
    aw_worktime_classes: "{{ lookup('file', aw_repo_root + '/aw-server/settings/classes-worktime.json') | from_json }}"
    aw_default_views: "{{ lookup('file', aw_repo_root + '/aw-server/settings/views-default.json') | from_json }}"
    aw_rust_release_dir: "{{ (lookup('env', 'CARGO_TARGET_DIR') | default(aw_repo_root + '/adk-rust/target', true)) + '/release' }}"

  tasks:
    - name: Установить базовые пакеты
      ansible.builtin.apt:
        name:
          - curl
          - python3-venv
          - python3-pip
          - rsync
          - tesseract-ocr
          - tesseract-ocr-rus
          - unzip
          - jq
        state: present
        update_cache: true

    - name: Установить пакеты для browser smoke проверки
      ansible.builtin.apt:
        name:
          - chromium
          - nodejs
          - node-playwright
        state: present
      when: aw_browser_smoke_enabled | default(true) | bool

    - name: Создать системную группу сервиса
      ansible.builtin.group:
        name: "{{ aw_server_group }}"
        system: true
        state: present

    - name: Создать системную учётную запись сервиса
      ansible.builtin.user:
        name: "{{ aw_server_user }}"
        group: "{{ aw_server_group }}"
        home: "{{ aw_server_data_dir }}"
        shell: /usr/sbin/nologin
        system: true
        create_home: false

    - name: Создать обязательные каталоги
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ aw_release_root }}"
        - "{{ aw_release_dir }}"
        - "{{ aw_release_install_dir }}"
        - /opt/activitywatch
        - /opt/activitywatch/bin
        - "{{ aw_server_webui_dir }}"
        - "{{ aw_server_webui_dir }}/js"
        - "{{ aw_server_data_dir }}"
        - "{{ aw_server_db_path | dirname }}"
        - "{{ aw_server_data_dir }}/.config"
        - "{{ aw_server_data_dir }}/.config/activitywatch"
        - "{{ aw_server_data_dir }}/.config/activitywatch/aw-server-rust"
        - "{{ aw_server_data_dir }}/backups"
        - "{{ aw_server_data_dir }}/slo"
        - "{{ aw_server_data_dir }}/browser-smoke"
        - "{{ aw_rus_health_state_dir }}"
        - "{{ aw_rus_health_validation_dir }}"
        - "{{ aw_server_log_dir }}"
        - /etc/activitywatch
        - /usr/local/lib/aw-rus-browser-smoke
        - "{{ aw_bootstrap_dir }}"

    - name: Настроить каталоги ActivityWatch с владельцем сервиса
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ aw_server_user }}"
        group: "{{ aw_server_group }}"
        mode: "0755"
      loop:
        - /opt/activitywatch
        - /opt/activitywatch/bin
        - "{{ aw_release_root }}"
        - "{{ aw_release_dir }}"
        - "{{ aw_release_install_dir }}"
        - "{{ aw_server_webui_dir }}"
        - "{{ aw_server_webui_dir }}/js"
        - "{{ aw_server_data_dir }}"
        - "{{ aw_server_db_path | dirname }}"
        - "{{ aw_server_data_dir }}/.config"
        - "{{ aw_server_data_dir }}/.config/activitywatch"
        - "{{ aw_server_data_dir }}/.config/activitywatch/aw-server-rust"
        - "{{ aw_server_data_dir }}/backups"
        - "{{ aw_server_data_dir }}/slo"
        - "{{ aw_server_data_dir }}/browser-smoke"
        - "{{ aw_rus_health_state_dir }}"
        - "{{ aw_rus_health_validation_dir }}"
        - "{{ aw_server_log_dir }}"

    - name: Проверить существующие health state files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ aw_rus_health_state_dir }}/aw-rus-health.json"
        - "{{ aw_rus_health_state_dir }}/aw-rus-health.txt"
        - "{{ aw_rus_health_state_dir }}/dlp-health-check-counters.json"
      register: aw_rus_health_state_files

    - name: Нормализовать владельца существующих health state files
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        owner: "{{ aw_server_user }}"
        group: "{{ aw_server_group }}"
        mode: "0644"
      loop: "{{ aw_rus_health_state_files.results }}"
      when: item.stat.exists | default(false)

    - name: Удалить устаревшие Python entrypoints после Rust migration
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/activitywatch/aw-rus-ops/health-check.sh
        - /opt/activitywatch/aw-rus-ops/hayabusa/aw-hayabusa-autoprocess.py
        - /opt/activitywatch/aw-rus-ops/hayabusa/aw-hayabusa-case-alert.py
        - /opt/activitywatch/aw-rus-ops/hayabusa/aw-hayabusa-from-windows.py
        - /opt/activitywatch/aw-rus-ops/hayabusa/aw-hayabusa-link-case.py
        - /opt/activitywatch/dlp-case-management/.venv
        - /opt/activitywatch/dlp-case-management/case_rules.py
        - /opt/activitywatch/dlp-case-management/case_schema.py
        - /opt/activitywatch/dlp-case-management/case_service.py
        - /opt/activitywatch/dlp-case-management/case_storage.py
        - /opt/activitywatch/dlp-case-management/evidence_chain.py
        - /opt/activitywatch/dlp-compliance/compliance_scheduler.py
        - /opt/activitywatch/dlp-compliance/report_generator.py
        - /opt/activitywatch/dlp-compliance/.venv
        - /opt/activitywatch/dlp-integrations/cef_exporter.py
        - /opt/activitywatch/dlp-integrations/syslog_forwarder.py
        - /opt/activitywatch/dlp-integrations/webhook_sender.py
        - /opt/activitywatch/dlp-integrations/.venv
        - /opt/activitywatch/dlp-policy-engine/.venv
        - /opt/activitywatch/dlp-policy-engine/policy_distributor.py
        - /opt/activitywatch/dlp-policy-engine/policy_schema.py
        - /opt/activitywatch/dlp-policy-engine/policy_service.py
        - /opt/activitywatch/dlp-policy-engine/policy_storage.py
        - /opt/activitywatch/scripts/aggregate_dlp_events.py
        - /usr/local/bin/aw-dlp-influx-exporter.py
        - /usr/local/bin/aw-extract-ioc-from-sigma.py
        - /usr/local/bin/aw-rus-healthd.py
        - /usr/local/bin/aw-slo-monitor.py
        - /usr/local/bin/aw-worktime-afk-bridge.py
        - /usr/local/bin/aw-worktime-api.py
        - /usr/local/bin/aw-worktime-influx-exporter.py
        - /usr/local/bin/aw-worktime-ui-bridge.py
        - /usr/local/bin/dlp-admin-cli.py
        - /usr/local/bin/merge_aw_server_dbs.py

    - name: Установить prune script для локального state
      ansible.builtin.copy:
        src: "{{ aw_repo_root }}/aw-server/aw-prune-local-state.sh"
        dest: /usr/local/bin/aw-prune-local-state.sh
        owner: root
        group: root
        mode: "0755"

    - name: Положить legacy prune script в server-side ops bundle
      ansible.builtin.copy:
        src: "{{ aw_repo_root }}/scripts/legacy/aw-prune-local-state.sh"
        dest: /opt/activitywatch/aw-rus-ops/aw-prune-local-state.sh
        owner: root
        group: root
        mode: "0755"

    - name: Проверить локальный Rust prune local state
      ansible.builtin.stat:
        path: "{{ aw_rust_release_dir }}/aw-prune-local-state"
      delegate_to: localhost
      register: aw_prune_local_state_rust_binary
      become: false

    - name: Установить Rust prune local state
      ansible.builtin.copy:
        src: "{{ aw_rust_release_dir }}/aw-prune-local-state"
        dest: /usr/local/bin/aw-prune-local-state-rust
        owner: root
        group: root
        mode: "0755"
      when: aw_prune_local_state_rust_binary.stat.exists | default(false)

    - name: Ограничить рост journald на aw-server
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/aw-rus-retention.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Journal]
          SystemMaxUse={{ aw_server_journal_system_max_use }}
          RuntimeMaxUse={{ aw_server_journal_runtime_max_use }}
          SystemKeepFree={{ aw_server_journal_system_keep_free }}
      register: aw_journald_dropin

    - name: Установить systemd service prune локального state
      ansible.builtin.copy:
        dest: /etc/systemd/system/aw-prune-local-state.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prune ActivityWatch local backups and temp state

          [Service]
          Type=oneshot
          Environment=AW_DATA_DIR={{ aw_server_data_dir }}
          Environment=AW_BACKUP_RETENTION_DAYS={{ aw_server_backup_retention_days }}
          Environment=AW_BACKUP_KEEP_LAST_DB={{ aw_server_backup_keep_last_db }}
          Environment=AW_BACKUP_KEEP_LAST_JSON={{ aw_server_backup_keep_last_json }}
          ExecStart=/usr/local/bin/aw-prune-local-state.sh

    - name: Установить systemd timer prune локального state
      ansible.builtin.copy:
        dest: /etc/systemd/system/aw-prune-local-state.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Daily prune of ActivityWatch local backups and temp state

          [Timer]
          OnCalendar=*-*-* 04:40:00
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Перечитать systemd после retention unit/drop-in
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Включить и запустить timer prune локального state
      ansible.builtin.systemd:
        name: aw-prune-local-state.timer
        enabled: true
        state: started

    - name: Применить journald retention без простоя
      ansible.builtin.command:
        argv:
          - systemctl
          - restart
          - systemd-journald
      when: aw_journald_dropin.changed
      failed_when: false

    - name: Сжать существующий journald до нового лимита
      ansible.builtin.command:
        argv:
          - journalctl
          - --vacuum-size={{ aw_server_journal_system_max_use }}
      changed_when: true
      failed_when: false

    - name: (Check mode) Пропустить установку релиза ActivityWatch
      ansible.builtin.debug:
        msg: "ansible_check_mode=true: download/unarchive/install of ActivityWatch release is skipped."
      when: ansible_check_mode

    - name: Установить релиз ActivityWatch (download/unarchive/install)
      when: not ansible_check_mode
      block:
        - name: Скачать архив релиза ActivityWatch
          ansible.builtin.get_url:
            url: "{{ aw_server_download_url }}"
            dest: "{{ aw_archive_path }}"
            mode: "0644"

        - name: Распаковать релиз ActivityWatch
          ansible.builtin.unarchive:
            src: "{{ aw_archive_path }}"
            dest: "{{ aw_release_dir }}"
            remote_src: true
            extra_opts: ["-o"]

        - name: Удалить временный архив ActivityWatch после распаковки
          ansible.builtin.file:
            path: "{{ aw_archive_path }}"
            state: absent

        - name: Найти распакованный каталог ActivityWatch
          ansible.builtin.find:
            paths: "{{ aw_release_dir }}"
            recurse: true
            file_type: directory
            patterns: "activitywatch*"
          register: aw_release_find

        - name: Найти бинарный файл AW server
          ansible.builtin.find:
            paths: "{{ aw_release_dir }}"
            recurse: true
            file_type: file
            patterns:
              - aw-server-rust
              - aw-server
          register: aw_server_binary_find

        - name: Найти index.html WebUI
          ansible.builtin.find:
            paths: "{{ aw_release_dir }}"
            recurse: true
            file_type: file
            patterns:
              - index.html
          register: aw_webui_index_find

        - name: Сохранить пути распакованного релиза (binary + webui index)
          ansible.builtin.set_fact:
            aw_release_extracted: "{{ (aw_release_find.files | default([]) | sort(attribute='path') | map(attribute='path') | list | first) | default('') }}"
            aw_server_binary_path: >-
              {{
                (
                  (
                    (aw_server_binary_find.files | default([]) | sort(attribute='path') | map(attribute='path') | list)
                    | select('match', '.*/aw-server-rust$') | list | first
                  )
                  | default(
                      (
                        (aw_server_binary_find.files | default([]) | sort(attribute='path') | map(attribute='path') | list | first)
                      ),
                      true
                    )
                ) | default('')
              }}
            aw_webui_index_path: >-
              {{
                (
                  (
                    (aw_webui_index_find.files | default([]) | sort(attribute='path') | map(attribute='path') | list)
                    | select('search', '/static/index\\.html$') | list | first
                  )
                  | default(
                      (
                        (aw_webui_index_find.files | default([]) | sort(attribute='path') | map(attribute='path') | list | first)
                      ),
                      true
                    )
                ) | default('')
              }}

        - name: Сохранить каталог WebUI (dirname index.html)
          ansible.builtin.set_fact:
            aw_webui_source_path: "{{ aw_webui_index_path | dirname }}"

        - name: Проверить, что компоненты релиза найдены
          ansible.builtin.assert:
            that:
              - aw_release_extracted is defined
              - aw_release_extracted | length > 0
              - aw_server_binary_path is defined
              - aw_server_binary_path | length > 0
              - aw_webui_source_path is defined
              - aw_webui_source_path | length > 0
            fail_msg: "Не удалось найти бинарный файл или WebUI в распакованном релизе ActivityWatch."

        - name: Создать каталог установленного релиза
          ansible.builtin.file:
            path: "{{ aw_release_install_dir }}"
            state: directory
            owner: "{{ aw_server_user }}"
            group: "{{ aw_server_group }}"
            mode: "0755"

        - name: Установить бинарный файл AW server
          ansible.builtin.copy:
            remote_src: true
            src: "{{ aw_server_binary_path }}"
            dest: "{{ aw_release_install_dir }}/aw-server-rust"
            owner: "{{ aw_server_user }}"
            group: "{{ aw_server_group }}"
            mode: "0755"

        - name: Создать ссылку на активный бинарный файл AW server
          ansible.builtin.file:
            src: "{{ aw_release_install_dir }}/aw-server-rust"
            dest: /opt/activitywatch/bin/aw-server-rust
            owner: "{{ aw_server_user }}"
            group: "{{ aw_server_group }}"
            state: link
            force: true

        - name: Синхронизировать WebUI в RU каталог
          ansible.builtin.command:
            cmd: "rsync -a {{ aw_webui_source_path }}/ {{ aw_server_webui_dir }}/"

        - name: Настроить владельца файлов /opt/activitywatch
          ansible.builtin.file:
            path: /opt/activitywatch
            state: directory
            owner: "{{ aw_server_user }}"
            group: "{{ aw_server_group }}"
            recurse: true

    - name: Установить systemd service из шаблона репозитория
      ansible.builtin.copy:
        dest: /etc/systemd/system/activitywatch-server.service
        mode: "0644"
        content: >-
          {{
            lookup('file', aw_repo_root + '/aw-server/activitywatch-server.service')
            | replace('__AW_SERVER_USER__', aw_server_user)
            | replace('__AW_SERVER_GROUP__', aw_server_group)
            | replace('__AW_SERVER_DATA_DIR__', aw_server_data_dir)
          }}
      notify:
        - Перезагрузить systemd
        - Перезапустить activitywatch

    - name: (Check mode) Пропустить WebUI patch и запуск сервиса
      ansible.builtin.debug:
        msg: "ansible_check_mode=true: WebUI patch + service start + API checks are skipped."
      when: ansible_check_mode

    - name: Применить WebUI RU patch и запустить сервис
      when: not ansible_check_mode
      block:
        - name: Скопировать RU patch файлы WebUI из репозитория
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            mode: "{{ item.mode }}"
            owner: "{{ aw_server_user }}"
            group: "{{ aw_server_group }}"
          loop:
            - { src: "{{ aw_repo_root }}/aw-server/aw-ru-patch.js", dest: "{{ aw_server_webui_dir }}/js/ru-patch-v5.js", mode: "0644" }
            - { src: "{{ aw_repo_root }}/aw-server/aw-sw-cleanup.js", dest: "{{ aw_server_webui_dir }}/js/sw-cleanup.js", mode: "0644" }
            - { src: "{{ aw_repo_root }}/aw-server/aw-worktime-panel.js", dest: "{{ aw_server_webui_dir }}/js/aw-worktime-panel.js", mode: "0644" }
            - { src: "{{ aw_repo_root }}/aw-server/aw-host-groups.json", dest: "{{ aw_server_webui_dir }}/js/aw-host-groups.json", mode: "0644" }

        - name: Создать каталог /opt/detmir/bootstrap для apply_webui_ru_patch.sh
          ansible.builtin.file:
            path: /opt/detmir/bootstrap
            state: directory
            mode: "0755"

        - name: Скопировать RU patch файлы для apply_webui_ru_patch.sh (хотфиксы compiled JS чанков)
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            mode: "{{ item.mode }}"
          loop:
            - { src: "{{ aw_repo_root }}/aw-server/aw-ru-patch.js", dest: "/opt/detmir/bootstrap/aw-ru-patch.js", mode: "0644" }
            - { src: "{{ aw_repo_root }}/aw-server/aw-sw-cleanup.js", dest: "/opt/detmir/bootstrap/aw-sw-cleanup.js", mode: "0644" }
            - { src: "{{ aw_repo_root }}/aw-server/aw-worktime-panel.js", dest: "/opt/detmir/bootstrap/aw-worktime-panel.js", mode: "0644" }
            - { src: "{{ aw_repo_root }}/aw-server/aw-host-groups.json", dest: "/opt/detmir/bootstrap/aw-host-groups.json", mode: "0644" }

        - name: Скопировать apply_webui_ru_patch.sh скрипт
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/apply_webui_ru_patch.sh"
            dest: /opt/activitywatch/aw-server/apply_webui_ru_patch.sh
            mode: "0755"

        - name: Создать server-side ops bundle для ранних health helpers
          ansible.builtin.file:
            path: /opt/activitywatch/aw-rus-ops
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Установить wrapper aw-health-check до Influx проверок
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/aw-health-check-wrapper.sh"
            dest: /usr/local/bin/aw-health-check
            owner: root
            group: root
            mode: "0755"

        - name: Проверить локальный Rust aw-health-check до Influx проверок
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/aw-health-check"
          delegate_to: localhost
          register: aw_health_check_rust_binary_early
          become: false

        - name: Установить Rust aw-health-check до Influx проверок
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/aw-health-check"
            dest: /usr/local/bin/aw-health-check-rust
            owner: root
            group: root
            mode: "0755"
          when: aw_health_check_rust_binary_early.stat.exists | default(false)

        - name: Требовать Rust aw-health-check до Influx проверок
          ansible.builtin.assert:
            that:
              - aw_health_check_rust_binary_early.stat.exists | default(false)
            fail_msg: "Rust aw-health-check artifact is required at {{ aw_rust_release_dir }}/aw-health-check"

        - name: Проверить локальный Rust aw-db-health до Influx проверок
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/aw-db-health"
          delegate_to: localhost
          register: aw_db_health_rust_binary_early
          become: false

        - name: Установить Rust aw-db-health до Influx проверок
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/aw-db-health"
            dest: /usr/local/bin/aw-db-health
            owner: root
            group: root
            mode: "0755"
          when: aw_db_health_rust_binary_early.stat.exists | default(false)

        - name: Проверить локальный Rust aw-ensure-reliability до Influx проверок
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/aw-ensure-reliability"
          delegate_to: localhost
          register: aw_ensure_reliability_rust_binary_early
          become: false

        - name: Установить Rust aw-ensure-reliability до Influx проверок
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/aw-ensure-reliability"
            dest: /usr/local/bin/aw-ensure-reliability
            owner: root
            group: root
            mode: "0755"
          when: aw_ensure_reliability_rust_binary_early.stat.exists | default(false)

        - name: Проверить локальный Rust aw-db-maintenance до Influx проверок
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/aw-db-maintenance"
          delegate_to: localhost
          register: aw_db_maintenance_rust_binary_early
          become: false

        - name: Установить Rust aw-db-maintenance до Influx проверок
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/aw-db-maintenance"
            dest: /usr/local/bin/aw-db-maintenance
            owner: root
            group: root
            mode: "0755"
          when: aw_db_maintenance_rust_binary_early.stat.exists | default(false)

        - name: Установить aw-db-maintenance service до Influx проверок
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/aw-db-maintenance.service"
            dest: /etc/systemd/system/aw-db-maintenance.service
            owner: root
            group: root
            mode: "0644"
          when: aw_db_maintenance_rust_binary_early.stat.exists | default(false)

        - name: Установить aw-db-maintenance timer до Influx проверок
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/aw-db-maintenance.timer"
            dest: /etc/systemd/system/aw-db-maintenance.timer
            owner: root
            group: root
            mode: "0644"
          when: aw_db_maintenance_rust_binary_early.stat.exists | default(false)

        - name: Включить weekly aw-db-maintenance timer до Influx проверок
          ansible.builtin.systemd:
            name: aw-db-maintenance.timer
            enabled: true
            state: started
            daemon_reload: true
          when: aw_db_maintenance_rust_binary_early.stat.exists | default(false)

        - name: Прочитать текущий aw-server.env для сохранения Influx token
          ansible.builtin.slurp:
            path: /etc/activitywatch/aw-server.env
          register: aw_existing_server_env_raw
          failed_when: false
          no_log: true

        - name: Подготовить effective runtime values без вывода секретов
          ansible.builtin.set_fact:
            aw_existing_server_env_text: "{{ aw_existing_server_env_raw.content | default('') | b64decode }}"
            aw_existing_worktime_influx_token: "{{ (aw_existing_server_env_raw.content | default('') | b64decode | regex_search('(?m)^AW_WORKTIME_INFLUX_TOKEN=.*$') | default('', true) | regex_replace('^AW_WORKTIME_INFLUX_TOKEN=', '')) }}"
            aw_existing_dlp_influx_token: "{{ (aw_existing_server_env_raw.content | default('') | b64decode | regex_search('(?m)^AW_DLP_INFLUX_TOKEN=.*$') | default('', true) | regex_replace('^AW_DLP_INFLUX_TOKEN=', '')) }}"
            aw_existing_monitored_windows_host: "{{ (aw_existing_server_env_raw.content | default('') | b64decode | regex_search('(?m)^AW_MONITORED_WINDOWS_HOST=.*$') | default('', true) | regex_replace('^AW_MONITORED_WINDOWS_HOST=', '')) }}"
            aw_existing_monitored_windows_hostname: "{{ (aw_existing_server_env_raw.content | default('') | b64decode | regex_search('(?m)^AW_MONITORED_WINDOWS_HOSTNAME=.*$') | default('', true) | regex_replace('^AW_MONITORED_WINDOWS_HOSTNAME=', '')) }}"
          no_log: true

        - name: Выбрать effective Influx tokens
          ansible.builtin.set_fact:
            aw_effective_worktime_influx_token: "{{ (aw_worktime_influx_token | default('') | string) if ((aw_worktime_influx_token | default('') | string | length) > 0) else aw_existing_worktime_influx_token }}"
            aw_effective_dlp_influx_token: "{{ (aw_dlp_influx_token | default('') | string) if ((aw_dlp_influx_token | default('') | string | length) > 0) else aw_existing_dlp_influx_token }}"
          no_log: true

        - name: Выбрать effective monitored Windows target
          ansible.builtin.set_fact:
            aw_effective_monitored_windows_host: >-
              {{
                (aw_monitored_windows_host | default('') | string)
                if (
                  (aw_monitored_windows_host | default('') | string | length) > 0
                  and (aw_monitored_windows_host | default('') | string | regex_search('192\\.0\\.2\\.|198\\.51\\.100\\.|203\\.0\\.113\\.|<|>|HOST-EXAMPLE|WINDOWS_USER_EXAMPLE')) is none
                )
                else aw_existing_monitored_windows_host
              }}
            aw_effective_monitored_windows_hostname: >-
              {{
                (aw_monitored_windows_hostname | default('') | string)
                if (
                  (aw_monitored_windows_hostname | default('') | string | length) > 0
                  and (aw_monitored_windows_hostname | default('') | string | regex_search('192\\.0\\.2\\.|198\\.51\\.100\\.|203\\.0\\.113\\.|<|>|HOST-EXAMPLE|WINDOWS_USER_EXAMPLE')) is none
                )
                else aw_existing_monitored_windows_hostname
              }}
          no_log: true

        - name: Выбрать effective worktime host
          ansible.builtin.set_fact:
            aw_effective_worktime_host: >-
              {{
                (aw_worktime_host | default('') | string)
                if (
                  (aw_worktime_host | default('') | string | length) > 0
                  and (aw_worktime_host | default('') | string | regex_search('192\\.0\\.2\\.|198\\.51\\.100\\.|203\\.0\\.113\\.|<|>|HOST-EXAMPLE|WINDOWS_USER_EXAMPLE')) is none
                )
                else aw_effective_monitored_windows_hostname
              }}
          no_log: true

        - name: Проверить monitored Windows target для production healthd
          ansible.builtin.assert:
            that:
              - (aw_effective_monitored_windows_host | default('') | string | length) > 0
              - (aw_effective_monitored_windows_host | default('') | string | regex_search('192\\.0\\.2\\.|198\\.51\\.100\\.|203\\.0\\.113\\.|<|>|HOST-EXAMPLE|WINDOWS_USER_EXAMPLE')) is none
              - (aw_effective_monitored_windows_hostname | default('') | string | length) > 0
              - (aw_effective_monitored_windows_hostname | default('') | string | regex_search('192\\.0\\.2\\.|198\\.51\\.100\\.|203\\.0\\.113\\.|<|>|HOST-EXAMPLE|WINDOWS_USER_EXAMPLE')) is none
              - (aw_effective_worktime_host | default('') | string | length) > 0
              - (aw_effective_worktime_host | default('') | string | regex_search('192\\.0\\.2\\.|198\\.51\\.100\\.|203\\.0\\.113\\.|<|>|HOST-EXAMPLE|WINDOWS_USER_EXAMPLE')) is none
            fail_msg: "aw-rus-healthd получил public example/TEST-NET Windows target. Задайте live значения в private inventory/env или сохраните их в runtime /etc/activitywatch/aw-server.env."
          when: aw_server_post_deploy_health_check_enabled | default(true) | bool

        - name: Проверить Influx token для AW worktime exporter
          ansible.builtin.assert:
            that:
              - aw_effective_worktime_influx_token is defined
              - aw_effective_worktime_influx_token | length > 0
              - (aw_effective_worktime_influx_token | string | lower | regex_search('^(change_me|changeme|replace-me|replace_me|token|secret|password|api_key|influx_token|write_token|your_.*|<.*>)$')) is none
            fail_msg: "aw_worktime_influx_enabled=true, но token пуст и в локальном env, и в текущем /etc/activitywatch/aw-server.env. Exporter будет падать и Grafana не получит worktime-ряды."
          when: aw_worktime_influx_enabled | default(false) | bool

        - name: Проверить Influx token для AW DLP exporter
          ansible.builtin.assert:
            that:
              - aw_effective_dlp_influx_token is defined
              - aw_effective_dlp_influx_token | length > 0
              - (aw_effective_dlp_influx_token | string | lower | regex_search('^(change_me|changeme|replace-me|replace_me|token|secret|password|api_key|influx_token|write_token|your_.*|<.*>)$')) is none
            fail_msg: "aw_dlp_influx_enabled=true, но token пуст и в локальном env, и в текущем /etc/activitywatch/aw-server.env. Exporter будет падать и Grafana не получит DLP-ряды."
          when: aw_dlp_influx_enabled | default(false) | bool

        - name: Проверить destination для AW worktime Influx exporter
          ansible.builtin.assert:
            that:
              - (aw_worktime_influx_url | default('') | string | length) > 0
              - "'192.0.2.' not in (aw_worktime_influx_url | default('') | string)"
              - "'198.51.100.' not in (aw_worktime_influx_url | default('') | string)"
              - "'203.0.113.' not in (aw_worktime_influx_url | default('') | string)"
              - (aw_worktime_influx_org | default('') | string | length) > 0
              - (aw_worktime_influx_org | default('') | string | lower | regex_search('example|change_me|changeme|replace-me|replace_me|your_|<|>')) is none
              - (aw_worktime_influx_bucket | default('') | string | length) > 0
              - (aw_worktime_influx_bucket | default('') | string | lower | regex_search('example|change_me|changeme|replace-me|replace_me|your_|<|>')) is none
              - (aw_worktime_influx_hosts | default('') | string | length) > 0
              - "'HOST-EXAMPLE' not in (aw_worktime_influx_hosts | default('') | string)"
              - "'WINDOWS_USER_EXAMPLE' not in (aw_worktime_influx_hosts | default('') | string)"
            fail_msg: "aw_worktime_influx_enabled=true, но URL/org/bucket/hosts похожи на public example/TEST-NET значения. Задайте live значения в private inventory/env, не в public repo."
          when: aw_worktime_influx_enabled | default(false) | bool

        - name: Проверить destination для AW DLP Influx exporter
          ansible.builtin.assert:
            that:
              - (aw_dlp_influx_url | default('') | string | length) > 0
              - "'192.0.2.' not in (aw_dlp_influx_url | default('') | string)"
              - "'198.51.100.' not in (aw_dlp_influx_url | default('') | string)"
              - "'203.0.113.' not in (aw_dlp_influx_url | default('') | string)"
              - (aw_dlp_influx_org | default('') | string | length) > 0
              - (aw_dlp_influx_org | default('') | string | lower | regex_search('example|change_me|changeme|replace-me|replace_me|your_|<|>')) is none
              - (aw_dlp_influx_bucket | default('') | string | length) > 0
              - (aw_dlp_influx_bucket | default('') | string | lower | regex_search('example|change_me|changeme|replace-me|replace_me|your_|<|>')) is none
              - (aw_dlp_influx_hosts | default('') | string | length) > 0
              - "'HOST-EXAMPLE' not in (aw_dlp_influx_hosts | default('') | string)"
              - "'WINDOWS_USER_EXAMPLE' not in (aw_dlp_influx_hosts | default('') | string)"
            fail_msg: "aw_dlp_influx_enabled=true, но URL/org/bucket/hosts похожи на public example/TEST-NET значения. Задайте live значения в private inventory/env, не в public repo."
          when: aw_dlp_influx_enabled | default(false) | bool

        - name: Записать /etc/activitywatch/aw-server.env перед хотфиксами
          ansible.builtin.copy:
            dest: /etc/activitywatch/aw-server.env
            mode: "0640"
            owner: root
            group: root
            content: |
              AW_SERVER_BIND_HOST={{ aw_server_bind_host }}
              AW_SERVER_PORT={{ aw_server_port }}
              AW_SERVER_DATA_DIR={{ aw_server_data_dir }}
              AW_SERVER_DB_PATH={{ aw_server_db_path }}
              AW_SERVER_LOG_DIR={{ aw_server_log_dir }}
              AW_SERVER_WEBUI_DIR={{ aw_server_webui_dir }}
              AW_SERVER_USER={{ aw_server_user }}
              AW_SERVER_GROUP={{ aw_server_group }}
              AW_WORKTIME_REPORT_BASE={{ aw_worktime_report_base }}
              AW_WORKTIME_TZ={{ aw_worktime_timezone }}
              AW_WORKTIME_HOST={{ aw_effective_worktime_host | default(aw_effective_monitored_windows_hostname | default('HOST-EXAMPLE')) }}
              AW_WORKTIME_EVENTS_LIMIT={{ aw_worktime_events_limit | default(250) }}
              AW_WORKTIME_AW_HTTP_TIMEOUT_SECONDS={{ aw_worktime_aw_http_timeout_seconds | default(6) }}
              AW_WORKTIME_EVENTS_CACHE_TTL_SECONDS={{ aw_worktime_events_cache_ttl_seconds | default(300) }}
              AW_WORKTIME_REPORT_CACHE_TTL_SECONDS={{ aw_worktime_report_cache_ttl_seconds | default(300) }}
              AW_WORKTIME_REPORT_STALE_TTL_SECONDS={{ aw_worktime_report_stale_ttl_seconds | default(3600) }}
              AW_WORKTIME_REPORT_DISK_STALE_TTL_SECONDS={{ aw_worktime_report_disk_stale_ttl_seconds | default(86400) }}
              AW_DLP_IOC_DIR={{ aw_dlp_ioc_workdir }}/output
              AW_DLP_POLICY_ENGINE_BIND_HOST={{ aw_dlp_policy_engine_bind_host }}
              AW_DLP_POLICY_ENGINE_PORT={{ aw_dlp_policy_engine_port }}
              AW_DLP_POLICY_ENGINE_DB_PATH={{ aw_dlp_policy_engine_db_path }}
              AW_DLP_CASE_BIND_HOST={{ aw_dlp_case_bind_host }}
              AW_DLP_CASE_PORT={{ aw_dlp_case_port }}
              AW_DLP_CASE_DB_PATH={{ aw_dlp_case_db_path }}
              AW_DLP_COMPLIANCE_REPORT_DIR={{ aw_dlp_compliance_report_dir }}
              AW_DLP_COMPLIANCE_TEMPLATE={{ aw_dlp_compliance_template_path }}
              AW_SERVER_URL=http://127.0.0.1:5600
              XDG_DATA_HOME={{ aw_server_data_dir }}/.local/share
              XDG_CONFIG_HOME={{ aw_server_data_dir }}/.config
              AW_WORKTIME_INFLUX_ENABLED={{ 'true' if (aw_worktime_influx_enabled | default(false) | bool) else 'false' }}
              AW_WORKTIME_INFLUX_URL={{ aw_worktime_influx_url | default('') }}
              AW_WORKTIME_INFLUX_ORG={{ aw_worktime_influx_org | default('proxmox') }}
              AW_WORKTIME_INFLUX_BUCKET={{ aw_worktime_influx_bucket | default('aw_metrics') }}
              AW_WORKTIME_INFLUX_HOSTS={{ aw_worktime_influx_hosts | default('HOST-EXAMPLE') }}
              AW_WORKTIME_INFLUX_DAYS={{ aw_worktime_influx_days | default('today,yesterday') }}
              AW_WORKTIME_INFLUX_TOKEN={{ aw_effective_worktime_influx_token | default('') }}
              AW_WORKTIME_MANAGEMENT_HISTORY_DIR={{ aw_worktime_management_history_dir | default(aw_server_data_dir ~ '/worktime-management-history') }}
              AW_WORKTIME_MANAGEMENT_HISTORY_DAYS={{ aw_worktime_management_history_days | default(31) }}
              AW_WORKTIME_MANAGEMENT_HISTORY_RETENTION_DAYS={{ aw_worktime_management_history_retention_days | default(120) }}
              AW_WORKTIME_MANAGER_OVERLOAD_COVERAGE_PCT={{ aw_worktime_manager_overload_coverage_pct | default(115) }}
              AW_WORKTIME_MANAGER_TREND_MIN_POINTS={{ aw_worktime_manager_trend_min_points | default(3) }}
              AW_WORKTIME_MANAGER_TREND_DELTA_PCT={{ aw_worktime_manager_trend_delta_pct | default(10) }}
              AW_WORKTIME_MANAGER_OFF_HOURS_THRESHOLD_SECONDS={{ aw_worktime_manager_off_hours_threshold_seconds | default(1800) }}
              AW_WORKTIME_MANAGER_INTERPRETATION_POLICY={{ aw_worktime_interpretation_policy_path | default('/etc/activitywatch/worktime-interpretation-policy.json') }}
              AW_DLP_INFLUX_ENABLED={{ 'true' if (aw_dlp_influx_enabled | default(false) | bool) else 'false' }}
              AW_DLP_INFLUX_URL={{ aw_dlp_influx_url | default('') }}
              AW_DLP_INFLUX_ORG={{ aw_dlp_influx_org | default('proxmox') }}
              AW_DLP_INFLUX_BUCKET={{ aw_dlp_influx_bucket | default('aw_metrics') }}
              AW_DLP_INFLUX_HOSTS={{ aw_dlp_influx_hosts | default('HOST-EXAMPLE') }}
              AW_DLP_INFLUX_LOOKBACK_DAYS={{ aw_dlp_influx_lookback_days | default(30) }}
              AW_DLP_INFLUX_EVENT_LIMIT={{ aw_dlp_influx_event_limit | default(2000) }}
              AW_DLP_INFLUX_TOKEN={{ aw_effective_dlp_influx_token | default('') }}
              AW_DLP_AW_API_BASE=http://127.0.0.1:5600/api/0
              AW_DLP_CASE_API_BASE=http://127.0.0.1:5602/api/0/dlp/cases
              AW_EXPECT_START_OF_DAY={{ aw_worktime_start_of_day | default('') }}
              AW_EXPECT_ALWAYS_ACTIVE_PATTERN={{ aw_server_always_active_pattern | default('') }}
              AW_EXPECT_LANDINGPAGE={{ aw_server_landingpage | default('') }}
              AW_HEALTH_STRICT_FILEOPS={{ aw_health_strict_fileops | default(0) }}
              AW_MONITORED_WINDOWS_HOST={{ aw_effective_monitored_windows_host }}
              AW_MONITORED_WINDOWS_HOSTNAME={{ aw_effective_monitored_windows_hostname }}
              AW_RUS_HEALTH_WORKTIME_API={{ aw_rus_health_worktime_api_base | default('http://127.0.0.1:5610') }}
              AW_RUS_HEALTH_STATE_DIR={{ aw_rus_health_state_dir }}
              AW_RUS_HEALTH_VALIDATION_DIR={{ aw_rus_health_validation_dir }}
              AW_RUS_HEALTH_SESSION_EVENTS_MAX_AGE_SECONDS={{ aw_rus_health_session_events_max_age_seconds | default(86400) }}
              AW_RUS_HEALTH_GUARD_MAX_AGE_SECONDS={{ aw_rus_health_guard_max_age_seconds | default(300) }}
              AW_RUS_HEALTH_GUARD_REQUIRED={{ 1 if (aw_rus_health_guard_required | default(true) | bool) else 0 }}
              AW_RUS_SLO_STATE_DIR={{ aw_server_data_dir }}/slo
              AW_RUS_SLO_AW_BASE=http://127.0.0.1:5600
              AW_RUS_SLO_WORKTIME_BASE={{ aw_rus_health_worktime_api_base | default('http://127.0.0.1:5610') }}
              AW_RUS_SLO_TARGET_PERCENT={{ aw_rus_slo_target_percent | default('99.97') }}
              AW_BROWSER_SMOKE_AW_BASE=http://127.0.0.1:5600
              AW_BROWSER_SMOKE_WORKTIME_BASE={{ aw_rus_health_worktime_api_base | default('http://127.0.0.1:5610') }}
              AW_BROWSER_SMOKE_HOST={{ aw_effective_monitored_windows_hostname }}
              AW_BROWSER_SMOKE_OUTPUT_DIR={{ aw_server_data_dir }}/browser-smoke
              AW_BROWSER_SMOKE_ENGINE={{ aw_browser_smoke_engine | default('chromium-cli') }}
              AW_BROWSER_SMOKE_TIMEOUT_MS={{ aw_browser_smoke_timeout_ms | default(20000) }}
              AW_BROWSER_SMOKE_RENDER_TIMEOUT_MS={{ aw_browser_smoke_render_timeout_ms | default(15000) }}
              AW_HAYABUSA_AUTO_CASE_ENABLED={{ 'true' if (aw_hayabusa_auto_case_enabled | default(true) | bool) else 'false' }}
              AW_HAYABUSA_AUTO_CASE_MIN_SEVERITY={{ aw_hayabusa_auto_case_min_severity | default('medium') }}
              AW_HAYABUSA_TELEGRAM_ENABLED={{ 'true' if (aw_hayabusa_telegram_enabled | default(false) | bool) else 'false' }}
              AW_HAYABUSA_TELEGRAM_MIN_SEVERITY={{ aw_hayabusa_telegram_min_severity | default('high') }}
              AW_HAYABUSA_TELEGRAM_BOT_TOKEN={{ aw_hayabusa_telegram_bot_token | default('') }}
              AW_HAYABUSA_TELEGRAM_CHAT_IDS={{ aw_hayabusa_telegram_chat_ids | default('') }}

        - name: Создать каталог DLP policy engine
          ansible.builtin.file:
            path: /opt/activitywatch/dlp-policy-engine
            state: directory
            owner: "{{ aw_server_user }}"
            group: "{{ aw_server_group }}"
            mode: "0755"
          when: aw_dlp_policy_engine_enabled | default(false) | bool

        - name: Установить systemd unit DLP policy engine
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/dlp-policy-engine/dlp-policy-engine.service"
            dest: /etc/systemd/system/aw-dlp-policy-engine.service
            owner: root
            group: root
            mode: "0644"
          when: aw_dlp_policy_engine_enabled | default(false) | bool

        - name: Проверить локальный Rust DLP policy engine
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/dlp-policy-engine"
          delegate_to: localhost
          register: aw_dlp_policy_engine_rust_binary
          become: false
          when: aw_dlp_policy_engine_enabled | default(false) | bool

        - name: Требовать Rust DLP policy engine artifact
          ansible.builtin.assert:
            that:
              - aw_dlp_policy_engine_rust_binary.stat.exists | default(false)
            fail_msg: "Missing Rust artifact: {{ aw_rust_release_dir }}/dlp-policy-engine"
          when: aw_dlp_policy_engine_enabled | default(false) | bool

        - name: Установить Rust DLP policy engine
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/dlp-policy-engine"
            dest: /usr/local/bin/aw-dlp-policy-engine-rust
            owner: root
            group: root
            mode: "0755"
          when:
            - aw_dlp_policy_engine_enabled | default(false) | bool
            - aw_dlp_policy_engine_rust_binary.stat.exists | default(false)

        - name: Создать каталог DLP content analysis
          ansible.builtin.file:
            path: /opt/activitywatch/dlp-content-analysis
            state: directory
            owner: "{{ aw_server_user }}"
            group: "{{ aw_server_group }}"
            mode: "0755"
          when: aw_dlp_content_analysis_enabled | default(true) | bool

        - name: Скопировать файлы DLP content analysis
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/dlp-content-analysis/"
            dest: /opt/activitywatch/dlp-content-analysis/
            owner: "{{ aw_server_user }}"
            group: "{{ aw_server_group }}"
            mode: "0644"
          when: aw_dlp_content_analysis_enabled | default(true) | bool

        - name: Установить wrapper запуска DLP content analysis через virtualenv
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/dlp-content-analysis/aw-dlp-content-analyzer.sh"
            dest: /usr/local/bin/aw-dlp-content-analyzer
            owner: root
            group: root
            mode: "0755"
          when: aw_dlp_content_analysis_enabled | default(true) | bool

        - name: Проверить локальный Rust DLP content analyzer
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/dlp-content-analyzer"
          delegate_to: localhost
          register: dlp_content_analyzer_rust_binary
          become: false
          when: aw_dlp_content_analysis_enabled | default(true) | bool

        - name: Установить Rust DLP content analyzer
          ansible.builtin.copy:
            src: "{{ aw_rust_release_dir }}/dlp-content-analyzer"
            dest: /usr/local/bin/aw-dlp-content-analyzer-rust
            owner: root
            group: root
            mode: "0755"
          when:
            - aw_dlp_content_analysis_enabled | default(true) | bool
            - dlp_content_analyzer_rust_binary.stat.exists | default(false)

        - name: Создать virtualenv DLP content analysis
          ansible.builtin.command:
            cmd: python3 -m venv /opt/activitywatch/dlp-content-analysis/.venv
          args:
            creates: /opt/activitywatch/dlp-content-analysis/.venv/bin/python
          when: aw_dlp_content_analysis_enabled | default(true) | bool

        - name: Установить зависимости DLP content analysis
          ansible.builtin.pip:
            requirements: /opt/activitywatch/dlp-content-analysis/requirements.txt
            virtualenv: /opt/activitywatch/dlp-content-analysis/.venv
          when: aw_dlp_content_analysis_enabled | default(true) | bool

        - name: Создать каталог DLP integrations
          ansible.builtin.file:
            path: /opt/activitywatch/dlp-integrations
            state: directory
            owner: "{{ aw_server_user }}"
            group: "{{ aw_server_group }}"
            mode: "0755"
          when: aw_dlp_integrations_enabled | default(true) | bool

        - name: Скопировать файлы DLP integrations
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/dlp-integrations/{{ item }}"
            dest: "/opt/activitywatch/dlp-integrations/{{ item }}"
            owner: "{{ aw_server_user }}"
            group: "{{ aw_server_group }}"
            mode: "0644"
          loop:
            - cef-config.yaml
            - syslog-forwarder-config.yaml
            - webhook-config.yaml
          when: aw_dlp_integrations_enabled | default(true) | bool

        - name: Создать state каталог DLP integrations
          ansible.builtin.file:
            path: /var/lib/activitywatch/dlp-integrations
            state: directory
            owner: "{{ aw_server_user }}"
            group: "{{ aw_server_group }}"
            mode: "0755"
          when: aw_dlp_integrations_enabled | default(true) | bool

        - name: Установить systemd unit CEF exporter
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/dlp-integrations/cef-exporter.service"
            dest: /etc/systemd/system/aw-dlp-cef-exporter.service
            owner: root
            group: root
            mode: "0644"
          when: aw_dlp_integrations_enabled | default(true) | bool

        - name: Установить systemd timer CEF exporter
          ansible.builtin.copy:
            src: "{{ aw_repo_root }}/aw-server/dlp-integrations/cef-exporter.timer"
            dest: /etc/systemd/system/aw-dlp-cef-exporter.timer
            owner: root
            group: root
            mode: "0644"
          when: aw_dlp_integrations_enabled | default(true) | bool

        - name: Проверить локальный Rust CEF exporter
          ansible.builtin.stat:
            path: "{{ aw_rust_release_dir }}/dlp-cef-exporter"
