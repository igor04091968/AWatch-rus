<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWatch-rus Portal</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" aria-label="Основная навигация">
      <div class="sidebar-brand">
        <strong>AWatch-rus</strong>
        <span>Workforce-first</span>
      </div>
      <nav class="tabs">
        <button class="tab is-active" data-tab="operator">Обзор</button>
        <button class="tab" data-tab="employees">Сотрудники</button>
        <button class="tab" data-tab="departments">Подразделения</button>
        <button class="tab" data-tab="owner">Риски</button>
        <button class="tab" data-tab="incidents">Расследования</button>
        <button class="tab" data-tab="perimeter">Сетевой периметр</button>
        <button class="tab" data-tab="reports">Отчеты</button>
        <button class="tab" data-tab="settings">Настройки</button>
      </nav>
    </aside>

    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">AWatch-rus</p>
          <h1>Пульс организации</h1>
          <p class="lead">Workforce, UEBA и события безопасности за выбранный период</p>
        </div>
        <div class="topbar-side" aria-label="Параметры отчета">
          <div class="control-strip">
            <label>
              <span>Период</span>
              <select id="periodFilter">
                <option value="today">Сегодня</option>
                <option value="week">7 дней</option>
                <option value="month">30 дней</option>
              </select>
            </label>
            <label>
              <span>Подразделение</span>
              <select id="departmentFilter">
                <option>Все</option>
              </select>
            </label>
          </div>
          <div class="header-actions">
            <button class="small-button primary" data-open-reports="true">Сформировать отчет</button>
            <button class="small-button" data-export-markdown="true">Markdown</button>
            <button class="small-button" data-print-report="true">PDF</button>
            <a class="small-button" href="/portal/api/reports" target="_blank" rel="noopener noreferrer">JSON</a>
            <div id="globalStatus" class="status-pill status-unknown">Загрузка</div>
          </div>
        </div>
      </header>

      <section id="content" class="content-panel" aria-live="polite"></section>
      <section id="summary" class="summary-grid service-summary"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
