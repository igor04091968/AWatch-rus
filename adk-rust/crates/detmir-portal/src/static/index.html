<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWatch-rus Portal</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">AWatch-rus</p>
        <h1>Активность / Риски / Расследования</h1>
        <p class="lead">Рабочий кабинет руководителя, ИБ и расследователя</p>
      </div>
      <div class="topbar-side" aria-label="Параметры отчета">
        <div class="control-strip">
          <label>
            <span>Период</span>
            <select id="periodFilter">
              <option>Сегодня</option>
              <option>Неделя</option>
              <option>Месяц</option>
            </select>
          </label>
          <label>
            <span>Подразделение</span>
            <select id="departmentFilter">
              <option>Все</option>
            </select>
          </label>
          <label>
            <span>Ответственный</span>
            <select id="ownerFilter">
              <option>Все</option>
            </select>
          </label>
        </div>
        <div class="header-actions">
          <button class="small-button" data-export-markdown="true">Текстовый отчет</button>
          <button class="small-button" data-print-report="true">Печать / PDF</button>
          <div id="globalStatus" class="status-pill status-unknown">Загрузка</div>
        </div>
      </div>
    </header>

    <nav class="tabs" aria-label="Разделы портала">
      <button class="tab is-active" data-tab="operator">Пульс организации</button>
      <button class="tab" data-tab="manager">Рабочее время</button>
      <button class="tab" data-tab="departments">Подразделения</button>
      <button class="tab" data-tab="employees">Сотрудники</button>
      <button class="tab" data-tab="owner">Риски</button>
      <button class="tab" data-tab="incidents">Расследования</button>
      <button class="tab" data-tab="perimeter">Сетевой периметр</button>
      <button class="tab" data-tab="reports">Отчеты</button>
    </nav>

    <section id="summary" class="summary-grid"></section>
    <section id="content" class="content-panel" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
